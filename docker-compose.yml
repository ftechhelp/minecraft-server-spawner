version: '3.8'

services:
  minecraft-spawner:
    build: .
    container_name: minecraft-spawner
    restart: unless-stopped
    privileged: true
    ports:
      - "8888:8888"  # Web interface
      - "25565-25665:25565-25665"  # Minecraft server port range
    volumes:
      - ./spawns:/app/spawns  # Persistent storage for Minecraft server data
      - ./backups:/app/backups  # Persistent storage for archived backups
    environment:
      - SPAWNS_DIR=/app/spawns  # Path used by the app to read/write spawn definitions
      - ARCHIVED_BACKUPS_DIR=/app/backups
      - WEB_PANEL_URL=${WEB_PANEL_URL:-http://localhost:8888}
      - SERVER_CONNECTION_HOST=${SERVER_CONNECTION_HOST:-localhost}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=gemini-3.1-flash-lite-preview
      - PYTHONUNBUFFERED=1
      - DOCKER_HOST=unix:///var/run/docker.sock
      - TZ=America/Vancouver
    networks:
      - minecraft-network

networks:
  minecraft-network:
    driver: bridge
